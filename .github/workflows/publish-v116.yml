name: Publish reviewed Internal N Crush 1.1.6
on:
  push:
    branches: [main]
    paths: ['.github/v116-publication.json']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful game build and identical runtime source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36166057247" > /tmp/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/36166057247/jobs" > /tmp/jobs.json
          python3 -c 'import json; r=json.load(open("/tmp/run.json")); j=json.load(open("/tmp/jobs.json"))["jobs"]; assert r["head_sha"]=="e41cfcac966a2dfb7533e4fb0ca739ee417f500d"; assert any(x["name"]=="windows" and x["conclusion"]=="success" for x in j)'
          git fetch --depth=1 origin e41cfcac966a2dfb7533e4fb0ca739ee417f500d
          git diff --name-only e41cfcac966a2dfb7533e4fb0ca739ee417f500d "$GITHUB_SHA" > /tmp/changed-paths
          python3 -c 'from pathlib import Path; p=Path("/tmp/changed-paths").read_text().splitlines(); assert all(x.startswith(".github/") or x=="RELEASE_NOTES_V116.md" for x in p),p'
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          run-id: 36166057247
          github-token: ${{ github.token }}
          path: release-files
      - name: Publish verified downloads from current release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS.txt
          python3 -c 'import json; r=json.load(open("WEB_RELEASE_v1.1.6.json")); assert r["version"]=="1.1.6" and r["source_commit"]=="e41cfcac966a2dfb7533e4fb0ca739ee417f500d"'
          if gh release view internal-n-crush-v1.1.6 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true
            gh release edit internal-n-crush-v1.1.6 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create internal-n-crush-v1.1.6 --draft --target "$GITHUB_SHA" --title "Internal N Crush 1.1.6" --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES_V116.md" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload internal-n-crush-v1.1.6 InternalNCrush_Windows_v1.1.6.zip InternalNCrush_Web_v1.1.6.zip InternalNCrush_NAS_Linux_v1.1.6.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload internal-n-crush-v1.1.6 WEB_RELEASE_v1.1.6.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit internal-n-crush-v1.1.6 --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES_V116.md"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/internal-n-crush-v1.1.6" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
