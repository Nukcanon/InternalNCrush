name: Build Internal N Crush Windows
on:
  push:
    paths:
      - 'games/relaystrike/**'
      - '.github/workflows/relaystrike.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relaystrike-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot and assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -p /tmp/templates.tpz templates/windows_release_x86_64.exe > ~/.local/share/godot/export_templates/4.4.1.stable/windows_release_x86_64.exe
          unzip -p /tmp/templates.tpz templates/windows_debug_x86_64.exe > ~/.local/share/godot/export_templates/4.4.1.stable/windows_debug_x86_64.exe
          python3 games/relaystrike/tools/prepare_assets.py
      - name: Import and bake original models
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --editor --import --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tools/build_models.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --editor --import --quit
      - name: 32-client capacity with paced startup
        env:
          GODOT: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
        run: python3 games/relaystrike/tests/run_network_capacity.py
      - name: Rules, gameplay and network lifecycle
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_rules.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_regressions.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_ai_aim.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_bots.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v04.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v05.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_kill_feed.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v06.gd
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64 python3 games/relaystrike/tests/run_network_probe.py
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64 python3 games/relaystrike/tests/run_network_lifecycle.py
      - name: New display, motion, replay and traversal checks
        run: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v07.gd
      - name: Human stature, dressing and authoritative physics props
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v1.gd
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64 python3 games/relaystrike/tests/run_network_props.py
      - name: Weapon handling, display choices and layered map traversal
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_v101.gd
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --script res://tests/test_vertical_traversal.gd
      - name: Late-start lifecycle regression
        env:
          GODOT: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          LIFECYCLE_STAGGER: '1.5'
        run: python3 games/relaystrike/tests/run_network_lifecycle.py
      - name: Export Windows and package
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out/InternalNCrush"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path games/relaystrike --export-release "Windows Desktop" "$GITHUB_WORKSPACE/out/InternalNCrush/InternalNCrush.exe"
          python3 games/relaystrike/tools/package_release.py --build-dir out/InternalNCrush --output-dir out
      - name: Publish downloadable build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view internal-n-crush-v1.0.1 >/dev/null 2>&1 || gh release create internal-n-crush-v1.0.1 --target "$GITHUB_SHA" --title "Internal N Crush 1.0.1" --notes-file games/relaystrike/docs/RELEASE_NOTES.md --latest
          gh release upload internal-n-crush-v1.0.1 out/InternalNCrush_Windows_v1.0.1.zip out/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: InternalNCrush-Windows
          path: out/InternalNCrush_Windows_v1.0.1.zip
