name: Prepare 1.1.6 artifact retry
on:
  push:
    paths: ['.github/v116-artifact-retry.json']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only superseded temporary artifacts from attempt one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 10877715077 10877615116 10877260490 10877120543; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > /tmp/artifact.json
            python3 -c 'import json; a=json.load(open("/tmp/artifact.json")); assert a["workflow_run"]["id"]==36163890832 and a["created_at"]<"2026-09-25T17:05:00Z"'
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          done
