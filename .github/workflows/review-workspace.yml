name: Prepare isolated review workspace
on:
  push:
    branches: ['fix/turret-viewmodel-face-114']
    paths: ['.github/workflows/review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reproducible review dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review-tools/templates
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d .review-tools
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          for template in windows_release_x86_64.exe windows_debug_x86_64.exe web_nothreads_release.zip web_nothreads_debug.zip; do
            unzip -p /tmp/templates.tpz "templates/$template" > ".review-tools/templates/$template"
          done
          python3 game/tools/prepare_assets.py
          git rev-parse HEAD > .review-tools/source_commit.txt
          tar --exclude='./.git' --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='*/.env' --exclude='./review-workspace.tar.gz' -czf /tmp/review-workspace.tar.gz .
          mv /tmp/review-workspace.tar.gz review-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-review-workspace
          path: review-workspace.tar.gz
          retention-days: 1
          compression-level: 0
