name: Build and publish Internal N Crush 1.5.0
# Four parallel job families share .github/scripts/ci_prepare.sh: the
# functional regressions split into shards, the review/audit checks, the
# network runners and the Windows/Web exports. The draft release is created
# only after every family has passed.
on:
  push:
    paths:
      - 'game/**'
      - 'windows/**'
      - 'web/**'
      - 'services/**'
      - 'nas/**'
      - '.github/workflows/windows.yml'
      - '.github/scripts/ci_prepare.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: internal-n-crush-validate-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
jobs:
  functional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot and bake models
        run: bash .github/scripts/ci_prepare.sh
      - name: Functional regressions (shard ${{ matrix.shard }} of 6)
        run: python3 game/tests/run_functional.py --shard ${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: functional-validation-${{ matrix.shard }}
          path: validation/functional-v11/*.log
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot and bake models
        run: bash .github/scripts/ci_prepare.sh
      - name: Render split, motion and ragdoll
        run: |
          set -euo pipefail
          $GODOT --headless --path game --check-only --script res://tests/network_capacity.gd
          timeout 180 $GODOT --headless --path game --script res://tests/test_render_split.gd
          timeout 90 $GODOT --headless --path game --script res://tests/test_motion_v115.gd -- --no-save-profile --no-update-check
          timeout 90 $GODOT --headless --path game --script res://tests/test_ragdoll_v115.gd
      - name: Validate revised grips, turret timing and mobile layout
        run: |
          set -euo pipefail
          timeout 180 $GODOT --headless --path game --script res://tests/test_details_v116.gd
          timeout 180 $GODOT --headless --path game --script res://tests/test_details_gameplay_v116.gd -- --no-save-profile --no-update-check
      - name: Validate melee, pellet impacts and touch controls
        run: timeout 180 $GODOT --headless --path game --script res://tests/test_melee_v117.gd -- --no-save-profile --no-update-check
      - name: Verify audible combat and deployment feedback
        run: timeout 180 xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tests/test_audio_feedback.gd -- --no-save-profile --no-update-check
      - name: Verify approved vocal alternatives and bot control permissions
        run: |
          set -euo pipefail
          timeout 180 xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tests/test_vocal_audio.gd -- --no-save-profile --no-update-check
          python3 game/tests/run_network_bot_settings.py
          python3 web/test_compact_audio.py
      - name: Verify equipment thumbnails, target HUD and map previews
        run: |
          set -euo pipefail
          timeout 600 xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tools/audit_button_text.gd
          xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tools/review_v125.gd -- --no-save-profile --no-update-check
          xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tools/review_maps_v125.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: review-v125
          path: validation/v125/*.png
      - name: Verify equipment footer and all objective routes
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tools/review_gear_v125.gd -- --no-save-profile --no-update-check
          timeout 120 $GODOT --headless --path game --script res://tools/audit_layout_v125.gd
      - name: Map surface audits
        run: |
          set -euo pipefail
          python3 game/tools/maps/test_tile_faces.py
          python3 game/tools/maps/audit_surfaces_v13.py
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot and bake models
        run: bash .github/scripts/ci_prepare.sh
      - name: 32-client capacity with paced startup
        run: python3 game/tests/run_network_capacity.py
      - name: Independent network clients, lifecycle and movable props
        run: |
          set -euo pipefail
          python3 game/tests/run_network_probe.py
          python3 game/tests/run_network_lifecycle.py
          python3 game/tests/run_network_props.py
          python3 game/tests/run_network_rotation.py
      - name: Late-start lifecycle regression
        env:
          LIFECYCLE_STAGGER: '1.5'
        run: python3 game/tests/run_network_lifecycle.py
      - name: Touch input and WebRTC host/client integration
        run: |
          set -euo pipefail
          pip install -r services/directory/requirements.txt
          $GODOT --headless --path game --script res://tests/test_touch.gd -- --touch-test --no-save-profile --no-update-check
          $GODOT --headless --path game --script res://tests/test_mobile_v128.gd
          $GODOT --headless --path game --script res://tests/test_map_pinch_v128.gd
          python3 game/tests/run_network_rtc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: network-validation
          if-no-files-found: ignore
          path: validation/webrtc-v11/*.log
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot, export templates and bake models
        env:
          WITH_TEMPLATES: '1'
        run: bash .github/scripts/ci_prepare.sh
      - name: Capture guide screens with the 1.4 cartoon graphics
        run: timeout 300 xvfb-run -a $GODOT --audio-driver Dummy --path game --script res://tools/review_v117.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: review-v117
          path: validation/v117/*
      - name: Export Windows and package
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out/InternalNCrush"
          $GODOT --headless --path game --export-release "Windows Desktop" "$GITHUB_WORKSPACE/out/InternalNCrush/InternalNCrush.exe"
          python3 game/tools/package_release.py --build-dir out/InternalNCrush --output-dir out
      - name: Export single-thread Web build
        run: |
          set -euo pipefail
          python3 web/prepare_lightweight.py
          mkdir -p web/build
          $GODOT --headless --path web/staging/game --editor --import --quit
          timeout 300 $GODOT --headless --path web/staging/game --script res://tools/build_models.gd
          $GODOT --headless --path web/staging/game --script res://tools/build_door_leaves.gd
          $GODOT --headless --path web/staging/game --script res://tools/build_arenas.gd
          python3 -c 'import json; assert json.load(open("game/assets/arenas/physics_signatures.json"))==json.load(open("web/staging/game/assets/arenas/physics_signatures.json")), "Native/Web collision mismatch"'
          timeout 300 $GODOT --headless --path web/staging/game --script res://tools/lightweight_models.gd
          $GODOT --headless --path web/staging/game --script res://tests/test_render_split.gd
          python3 -c 'from pathlib import Path; from PIL import Image; p=sorted(Path("web/staging/game/assets/menu_slides").glob("*.jpg")); assert len(p)==12 and all(Image.open(f).size==(1920,1080) for f in p); print("VERIFIED_COMBAT_SLIDES 12 full-HD combat photographs")'
          $GODOT --headless --path web/staging/game --editor --import --quit
          web_name="game-${GITHUB_SHA:0:12}"
          $GODOT --headless --path web/staging/game --export-release Web "$GITHUB_WORKSPACE/web/build/$web_name.html"
          mv "web/build/$web_name.html" web/build/index.html
          python3 web/test_webgl_handles.py "web/build/$web_name.js"
          mkdir -p web/build/guide
          for screen in controls touch settings lan internet; do cp "validation/v117/$screen.jpg" "web/build/guide/$screen.jpg"; done
          python3 -c 'from nas.setup import package; package("out/InternalNCrush_NAS_Linux_v1.5.0.zip", include_config=False)'
          python3 web/package_web.py
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: InternalNCrush-Web
          path: web/build/*
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: InternalNCrush-Windows
          path: out/InternalNCrush_Windows_v1.5.0.zip
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: release-files
          if-no-files-found: error
          path: |
            out/InternalNCrush_Windows_v1.5.0.zip
            out/InternalNCrush_Web_v1.5.0.zip
            out/InternalNCrush_NAS_Linux_v1.5.0.zip
            out/WEB_RELEASE_v1.5.0.json
            out/SHA256SUMS.txt
  publish-release:
    needs: [functional, checks, network, build]
    if: github.ref == 'refs/heads/main' && github.repository == 'Nukcanon/InternalNCrush'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Create draft 1.5.0 downloads after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
          cd release-files
          sha256sum --check SHA256SUMS.txt
          if gh release view internal-n-crush-v1.5.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/is-draft; then
            if [ "$(cat /tmp/is-draft)" != true ]; then
              echo "1.5.0 is already public; preserve its verified immutable assets."
              exit 0
            fi
            gh release edit internal-n-crush-v1.5.0 --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create internal-n-crush-v1.5.0 --draft --target "$GITHUB_SHA" --title "Internal N Crush 1.5.0" --notes "Barred railings at deep water, lane walls against grenade spam, true top-down map view, new gun, rocket, grenade and reload sounds, working pumps and back-to-back shell loading, steadier throwing arms, and many fixes." --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload internal-n-crush-v1.5.0 InternalNCrush_Windows_v1.5.0.zip InternalNCrush_Web_v1.5.0.zip InternalNCrush_NAS_Linux_v1.5.0.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          # Publish the installation descriptor last, after both downloads exist.
          gh release upload internal-n-crush-v1.5.0 WEB_RELEASE_v1.5.0.json --clobber --repo "$GITHUB_REPOSITORY"

          # Keep this draft until rendered Windows/Web soak results are reviewed.
          gh release edit internal-n-crush-v1.5.0 --notes-file ../RELEASE_NOTES_V150.md --repo "$GITHUB_REPOSITORY"
