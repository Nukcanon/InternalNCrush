services:
  directory:
    build: ../services/directory
    init: true
    restart: unless-stopped
    environment:
      MAX_ROOMS: ${MAX_ROOMS:-128}
      GAME_VERSION: 1.2.1
      ALLOWED_ORIGINS: https://nukcanon.github.io
      TRUST_PROXY: "1"
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]
  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Run the setup wizard first}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["${BIND_IP:-127.0.0.1}:${HTTP_PORT:-18080}:80", "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-18443}:443"]
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile.external}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      directory:
        condition: service_healthy
    networks: [private]
networks:
  private:
volumes:
  caddy_data:
  caddy_config:

